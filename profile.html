<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Driver</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://stymmythxvfhtfxdvcag.supabase.co",
"sb_publishable_SlQWfTzw1vqLS78Acs5EPQ_ww-bYyqM"
);

window.supabase = supabase;
</script>

<style>
:root{--primary:#e60023}
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.container{padding:15px}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);margin-bottom:15px}
.profile-img{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;margin:auto}
.center{text-align:center}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:white;margin-top:10px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
.modal-box{background:white;padding:20px;border-radius:10px;width:90%;max-width:400px}
</style>
</head>

<body>

<div class="container">

<button onclick="goBack()">← Kembali</button>

<div class="card center">
<img id="foto" class="profile-img">
<h3 id="nama"></h3>
<p id="saldo"></p>
</div>

<div class="card">
<p><b>Alamat:</b> <span id="alamat"></span></p>
<p><b>No WA:</b> <span id="wa"></span></p>
<p><b>Tanggal Daftar:</b> <span id="tanggal"></span></p>

<button onclick="openPassword()">Ganti Password</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Top Up Saldo</h3>
<input id="topNama" placeholder="Nama">
<input id="topWa" placeholder="No WA">
<input id="topNominal" placeholder="Nominal">
<button onclick="topUp()">TOP UP</button>
</div>

</div>

<!-- MODAL PASSWORD -->
<div id="modalPass" class="modal">
<div class="modal-box">
<h3>Ganti Password</h3>
<input id="oldPass" type="password" placeholder="Password Lama">
<input id="newPass" type="password" placeholder="Password Baru">
<input id="newPass2" type="password" placeholder="Ulangi Password Baru">
<button onclick="savePassword()">Simpan</button>
<button onclick="closeModal()">Batal</button>
</div>
</div>

<!-- MODAL UMUM -->
<div id="modal" class="modal">
<div class="modal-box">
<p id="modalText"></p>
<button onclick="closeModal()">OK</button>
</div>
</div>

<!-- 🔥 MODAL ORDER -->
<div id="orderModal" class="modal">
<div class="modal-box" style="max-height:80vh;overflow:auto">
<h3>ORDER MASUK</h3>
<div id="orderContent"></div>
<button onclick="terimaOrder()">TERIMA</button>
<button onclick="tolakOrder()">TOLAK</button>
</div>
</div>

<script>
let driverData=null
let modalOpen=false
let currentOrder=null
let orderTimer=null

document.addEventListener("DOMContentLoaded",init)

async function init(){
    const token = localStorage.getItem("token")

    const { data } = await supabase.rpc("cek_session",{p_token:token})
    if(!data || data.length===0){
        location.href="index.html"
        return
    }

    const userId = data[0].user_id

    const res = await supabase.from("drivers").select("*").eq("id",userId).single()
    driverData = res.data

    loadData()
    listenOrder()
}

function loadData(){
    foto.src = getImage(driverData.foto)
    nama.innerText = driverData.nama
    saldo.innerText = "Saldo: Rp " + driverData.saldo
    alamat.innerText = driverData.alamat
    wa.innerText = driverData.no_wa
    tanggal.innerText = new Date(driverData.created_at).toLocaleDateString()
}

function getImage(path){
    return supabase.storage.from("data-ojek").getPublicUrl(path).data.publicUrl
}

// ================= ORDER =================
function listenOrder(){
    supabase.channel('orders')
    .on('postgres_changes',
    {event:'INSERT',schema:'public',table:'orders'},
    async payload=>{

        if(!driverData.on_bid) return
        if(driverData.status!=="aktif") return
        if(modalOpen) return

        const { data:cek } = await supabase
        .from("orders")
        .select("id")
        .eq("driver_id",driverData.id)
        .neq("status","selesai")

        if(cek.length>0) return

        showOrder(payload.new)
    }).subscribe()
}

async function showOrder(order){
    modalOpen=true
    currentOrder=order

    let html = `
    <p><b>Jenis:</b> ${order.jenis}</p>
    <p><b>Jemput:</b> ${order.titik_jemput}</p>
    <p><b>Antar:</b> ${order.titik_antar}</p>
    <p><b>Tarif:</b> ${order.ongkir}</p>
    <p><b>Total:</b> ${order.total}</p>
    `

    if(order.jenis==="makanan"){
        const { data } = await supabase
        .from("order_detail")
        .select("qty,menu(nama)")
        .eq("order_id",order.id)

        html+="<div style='max-height:150px;overflow:auto'>"
        data.forEach(d=>{
            html+=`<p>${d.menu.nama} x${d.qty}</p>`
        })
        html+="</div>"
    }

    orderContent.innerHTML=html
    orderModal.style.display="flex"

    orderTimer=setTimeout(closeOrder,7000)
}

window.terimaOrder = async ()=>{
    await supabase.from("orders")
    .update({
        driver_id:driverData.id,
        status:"diambil"
    })
    .eq("id",currentOrder.id)
    .is("driver_id",null)

    closeOrder()
}

window.tolakOrder = ()=>closeOrder()

function closeOrder(){
    modalOpen=false
    currentOrder=null
    clearTimeout(orderTimer)
    orderModal.style.display="none"
}

// ================= PASSWORD =================
function openPassword(){ modalPass.style.display="flex" }
function closeModal(){
    modalPass.style.display="none"
    modal.style.display="none"
}

function showModal(msg){
    modalText.innerText=msg
    modal.style.display="flex"
}

async function savePassword(){
    if(oldPass.value!==driverData.password){
        showModal("Password lama salah")
        return
    }
    if(newPass.value!==newPass2.value){
        showModal("Password tidak sama")
        return
    }

    await supabase.from("drivers")
    .update({password:newPass.value})
    .eq("id",driverData.id)

    showModal("Password berhasil diubah")
    closeModal()
}

// ================= TOP UP =================
function topUp(){
    if(!topNama.value||!topWa.value||!topNominal.value){
        showModal("Semua form wajib diisi")
        return
    }

    const text=`Halo admin, saya ingin top up saldo:%0A
Nama:${topNama.value}%0A
WA:${topWa.value}%0A
Nominal:${topNominal.value}`

    window.open(`https://wa.me/6285189398042?text=${text}`)
}

// ================= NAV =================
async function logout(){
    const token = localStorage.getItem("token")
    await supabase.rpc("logout_session",{p_token:token})
    localStorage.removeItem("token")
    location.href="index.html"
}

function goBack(){ location.href="index.html" }
</script>

</body>
</html>
